<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 每日待办事项</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF8F5;
            --white: #FFFFFF;
            --charcoal: #1A1A2E;
            --terracotta: #C4664A;
            --terracotta-hover: #A8553A;
            --sage: #7A9B76;
            --danger: #D4503A;
            --danger-light: #FDE8E0;
            --gray-100: #F5F0EB;
            --gray-200: #E8E0D8;
            --gray-300: #D4C8BC;
            --gray-400: #A89888;
            --gray-500: #7A6E62;
            --gray-600: #5A5047;
            --gray-700: #3D3530;
            --gray-800: #2A2420;
            --shadow-sm: 0 1px 4px rgba(42,36,32,0.04);
            --shadow: 0 2px 12px rgba(42,36,32,0.06);
            --shadow-md: 0 4px 20px rgba(42,36,32,0.08);
            --shadow-lg: 0 8px 32px rgba(42,36,32,0.10);
            --radius: 12px;
            --radius-md: 14px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        .deco-circle-1 {
            position: fixed;
            top: 10%;
            right: 8%;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(122,155,118,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .deco-circle-2 {
            position: fixed;
            bottom: 8%;
            left: 5%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,102,74,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(212,200,188,0.4);
            animation: fadeSlideUp 0.5s ease-out both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Noto Serif SC', serif;
            text-align: center;
            color: var(--gray-800);
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        p {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .error-message {
            background: var(--danger-light);
            color: var(--danger);
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            border: 1px solid rgba(212,80,58,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray-700);
            font-size: 14px;
            font-weight: 600;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            transition: all 0.2s;
            background: var(--gray-100);
            font-family: 'Noto Sans SC', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--terracotta);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(196,102,74,0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--terracotta);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-submit:hover {
            background: var(--terracotta-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--gray-500);
        }

        .footer a {
            color: var(--terracotta);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            color: var(--terracotta-hover);
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-800);
            color: white;
            padding: 14px 28px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--sage); }
        .toast.error { background: var(--danger); }

        .toast::before { font-size: 16px; }
        .toast.success::before { content: '\2713'; }
        .toast.error::before { content: '\2715'; }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
                margin: 16px;
                border-radius: var(--radius-md);
            }

            h1 {
                font-size: 22px;
            }

            input[type="password"] {
                padding: 11px 14px;
                font-size: 15px;
            }

            .btn-submit {
                padding: 13px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="deco-circle-1"></div>
    <div class="deco-circle-2"></div>
    <div class="container" id="mainContainer">
        <h1>重置密码</h1>
        <p>请输入您的新密码</p>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form id="resetForm" onsubmit="handleSubmit(event)">
            <input type="hidden" id="token" value="{{ token or '' }}">
            
            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" required placeholder="请输入新密码（至少6个字符）" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入新密码">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">重置密码</button>
        </form>

        <div class="footer">
            <a href="/login">返回登录</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        {% if error %}
        document.getElementById('resetForm').style.display = 'none';
        {% endif %}
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!token) {
                showToast('无效的令牌', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showToast('密码长度至少6个字符', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '重置中...';
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: token,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('密码重置成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showToast(data.error || '重置失败', 'error');
                }
            } catch (error) {
                showToast('重置失败，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
            }
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
