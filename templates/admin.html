<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 每日待办事项</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='3' fill='%23C4664A'/%3E%3Crect x='5' y='7' width='22' height='18' rx='2' fill='%23FAF8F5'/%3E%3Cpath d='M8 12 L12 16 L20 8' stroke='%237A9B76' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='8' y1='20' x2='20' y2='20' stroke='%23D4C8BC' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.proxy.ustclug.org">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.proxy.ustclug.org/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF8F5;
            --white: #FFFFFF;
            --charcoal: #1A1A2E;
            --terracotta: #C4664A;
            --terracotta-hover: #A8553A;
            --sage: #7A9B76;
            --sage-light: #E8F0E6;
            --danger: #D4503A;
            --danger-light: #FDE8E0;
            --gray-100: #F5F0EB;
            --gray-200: #E8E0D8;
            --gray-300: #D4C8BC;
            --gray-400: #A89888;
            --gray-500: #7A6E62;
            --gray-600: #5A5047;
            --gray-700: #3D3530;
            --gray-800: #2A2420;
            --shadow-sm: 0 1px 4px rgba(42,36,32,0.04);
            --shadow: 0 2px 12px rgba(42,36,32,0.06);
            --shadow-md: 0 4px 20px rgba(42,36,32,0.08);
            --shadow-lg: 0 8px 32px rgba(42,36,32,0.10);
            --radius: 12px;
            --radius-md: 14px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--cream);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        .header {
            background: var(--gray-800);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 14px;
        }

        .user-info .datetime {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.4;
        }

        .user-info .datetime .date {
            font-size: 12px;
            opacity: 0.8;
        }

        .user-info .datetime .time {
            font-size: 14px;
            font-weight: 600;
        }

        .user-info .username {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-logout:hover {
            background: var(--danger);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            transition: border-color 0.2s;
            background: var(--white);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--terracotta);
            box-shadow: 0 0 0 3px rgba(196,102,74,0.08);
        }

        .btn-add {
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-add:hover {
            background: var(--terracotta-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-test-email {
            background: var(--sage);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-test-email:hover {
            background: #6A8B66;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .users-table {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(212,200,188,0.4);
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--gray-100);
        }

        .table-header h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 18px;
            color: var(--gray-700);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--gray-100);
            padding: 12px 24px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--gray-200);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--gray-100);
            font-size: 14px;
            color: var(--gray-700);
        }

        tr:nth-child(even) {
            background: rgba(245,240,235,0.4);
        }

        tr:hover {
            background: var(--gray-100);
        }

        .admin-badge {
            display: inline-block;
            background: var(--terracotta);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-view {
            background: #5B8DB8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-view:hover {
            background: #4A7CA7;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-delete:hover {
            background: #B84430;
        }

        .btn-reset {
            background: var(--gray-400);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-reset:hover {
            background: var(--gray-500);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px;
            border-top: 1px solid var(--gray-200);
        }

        .pagination button {
            background: var(--white);
            border: 1px solid var(--gray-200);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--gray-600);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--gray-100);
            border-color: var(--gray-300);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .active {
            background: var(--terracotta);
            color: white;
            border-color: var(--terracotta);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42,36,32,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(212,200,188,0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            color: var(--gray-800);
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .btn-close:hover {
            color: var(--gray-700);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray-700);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            transition: all 0.2s;
            background: var(--gray-100);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--terracotta);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(196,102,74,0.08);
        }

        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            background: var(--gray-200);
            color: var(--gray-600);
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-cancel:hover {
            background: var(--gray-300);
        }

        .btn-submit {
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-submit:hover {
            background: var(--terracotta-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .user-detail {
            margin-top: 20px;
        }

        .user-detail h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            color: var(--gray-800);
            margin-bottom: 16px;
        }

        .detail-item {
            display: flex;
            margin-bottom: 12px;
        }

        .detail-label {
            width: 120px;
            color: var(--gray-500);
            font-size: 14px;
        }

        .detail-value {
            flex: 1;
            color: var(--gray-700);
            font-size: 14px;
        }

        .todos-list {
            margin-top: 20px;
        }

        .todo-item {
            padding: 12px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--gray-300);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .todo-checkbox.checked {
            background: var(--sage);
            border-color: var(--sage);
        }

        .todo-checkbox.checked::after {
            content: '\2713';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .todo-content {
            flex: 1;
        }

        .todo-title {
            font-size: 14px;
            color: var(--gray-700);
            font-weight: 500;
        }

        .todo-date {
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-800);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1001;
            box-shadow: var(--shadow-lg);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error { background: var(--danger); }
        .toast.success { background: var(--sage); }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--gray-400);
        }

        .empty-state-icon {
            margin-bottom: 16px;
        }

        .empty-state-icon svg {
            width: 48px;
            height: 48px;
        }

        .empty-state p {
            font-size: 15px;
        }

        @media (max-width: 480px) {
            .header { padding: 15px 20px; }
            .header h1 { font-size: 20px; }
            .container { padding: 15px; }
            .toolbar { flex-direction: column; align-items: stretch; gap: 12px; }
            .search-box { max-width: none; }
            .btn-add { width: 100%; }
            th, td { padding: 10px 12px; font-size: 12px; }
            .btn-view, .btn-delete, .btn-reset { padding: 5px 10px; font-size: 11px; }
            .modal-content { padding: 15px; width: 95%; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .header { padding: 20px 25px; }
            .header h1 { font-size: 22px; }
            .container { padding: 20px; }
            .toolbar { flex-direction: row; align-items: center; }
            .search-box { max-width: 300px; }
            .btn-add { width: auto; }
            th, td { padding: 12px 14px; font-size: 13px; }
            .modal-content { padding: 20px; }
        }

        @media (min-width: 769px) {
            .header { padding: 30px; }
            .header h1 { font-size: 28px; }
            .container { padding: 30px; }
            .toolbar { flex-direction: row; align-items: center; }
            .search-box { max-width: 400px; }
            .btn-add { width: auto; }
            th, td { padding: 14px 20px; font-size: 14px; }
            .modal-content { padding: 30px; max-width: 600px; }
        }
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid rgba(212,200,188,0.4);
            border-radius: var(--radius-lg);
            padding: 15px 18px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 23px;
            font-weight: 700;
            color: var(--terracotta);
        }
        .stat-label { font-size: 12px; color: var(--gray-500); }

        .status-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-active { background: #E8F0E6; color: #5B7A57; }
        .status-disabled { background: #FDE8E0; color: #B84430; }

        .btn-edit-user {
            background: #E8EEF5;
            color: #4A6E91;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .btn-edit-user:hover { background: #D6E2EE; }

        .btn-toggle {
            background: var(--gray-400);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .btn-toggle:hover { background: var(--gray-500); }

        .btn-unlock {
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .btn-unlock:hover { background: var(--terracotta-hover); }

        .audit-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-top: 20px;
            border: 1px solid rgba(212,200,188,0.4);
            overflow: hidden;
        }
        .audit-list { padding: 6px 24px 16px; }
        .audit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 13px;
            color: var(--gray-600);
        }
        .audit-item:last-child { border-bottom: none; }
        .audit-time { color: var(--gray-400); font-size: 12px; white-space: nowrap; }
        .audit-empty { padding: 24px 0; text-align: center; color: var(--gray-400); font-size: 13px; }

    </style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#C4664A">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
    <div class="header admin-header">
        <h1>管理后台</h1>
        <div class="header-actions">
            <div class="user-info">
                <div class="datetime">
                    <span class="date" id="currentDate"></span>
                    <span class="time" id="currentTime"></span>
                </div>
                <span class="username" id="adminUsername"></span>
            </div>
            <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="stat-cards">
            <div class="stat-card">
                <span class="stat-value" id="statUsers">-</span>
                <span class="stat-label">用户总数</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statActive">-</span>
                <span class="stat-label">7 天活跃</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statTodos">-</span>
                <span class="stat-label">待办总数</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statPending">-</span>
                <span class="stat-label">未完成</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statOverdue">-</span>
                <span class="stat-label">已逾期</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statRate">-</span>
                <span class="stat-label">完成率</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statEmailsPending">-</span>
                <span class="stat-label">待发邮件</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statEmailsFailed">-</span>
                <span class="stat-label">失败邮件</span>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索用户名或邮箱..." oninput="handleSearch()">
            </div>
            <button class="btn-add" onclick="openAddModal()">+ 添加用户</button>
            <button class="btn-test-email" onclick="openTestEmailModal()">测试邮件</button>
        </div>

        <div class="users-table">
            <div class="table-header">
                <h2>用户列表</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>待办数量</th>
                            <th>注册时间</th>
                            <th>最后登录</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="9">
                                <div class="empty-state">
                                    <div class="empty-state-icon">
                                        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="16" cy="14" r="5"/>
                                            <path d="M6 34c0-5.5 4.5-10 10-10s10 4.5 10 10"/>
                                            <circle cx="34" cy="18" r="4"/>
                                            <path d="M28 34c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                                        </svg>
                                    </div>
                                    <p>加载中...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div class="audit-card">
            <div class="table-header">
                <h2>邮件队列</h2>
                <button class="btn-view" onclick="loadEmails()">刷新</button>
            </div>
            <div class="audit-list" id="emailList">
                <p class="audit-empty">加载中...</p>
            </div>
        </div>
        <div class="audit-card">
            <div class="table-header">
                <h2>最近操作</h2>
            </div>
            <div class="audit-list" id="auditLogs">
                <p class="audit-empty">加载中...</p>
            </div>
        </div>

    </div>

    <div class="modal" role="dialog" aria-modal="true" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加用户</h2>
                <button class="btn-close" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="addUserForm" onsubmit="handleAddUser(event)">
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" required placeholder="至少3个字符">
                </div>
                <div class="form-group">
                    <label for="email">邮箱 *</label>
                    <input type="email" id="email" name="email" required placeholder="请输入邮箱地址">
                </div>
                <div class="form-group">
                    <label for="password">密码 *</label>
                    <input type="password" id="password" name="password" required placeholder="至少6个字符">
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="isAdmin" name="isAdmin">
                        <label for="isAdmin">设为管理员</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeAddModal()">取消</button>
                    <button type="submit" class="btn-submit">添加</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" role="dialog" aria-modal="true" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>用户详情</h2>
                <button class="btn-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div id="userDetail"></div>
        </div>
    </div>

    <div class="modal" role="dialog" aria-modal="true" id="testEmailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>测试邮件</h2>
                <button class="btn-close" onclick="closeTestEmailModal()">&times;</button>
            </div>
            <form id="testEmailForm" onsubmit="handleTestEmail(event)">
                <div class="form-group">
                    <label for="testEmail">收件人邮箱 *</label>
                    <input type="email" id="testEmail" name="testEmail" required placeholder="请输入测试邮箱地址">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeTestEmailModal()">取消</button>
                    <button type="submit" class="btn-submit">发送测试邮件</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" role="dialog" aria-modal="true" id="editUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑用户</h2>
                <button class="btn-close" onclick="closeEditUserModal()">&times;</button>
            </div>
            <form id="editUserForm" onsubmit="saveEditUser(event)">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="editUsername">用户名</label>
                    <input type="text" id="editUsername" required maxlength="32">
                </div>
                <div class="form-group">
                    <label for="editUserEmail">邮箱</label>
                    <input type="email" id="editUserEmail" required>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="editIsAdmin">
                        <label for="editIsAdmin">管理员</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="editIsActive">
                        <label for="editIsActive">启用账户</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeEditUserModal()">取消</button>
                    <button type="submit" class="btn-submit" id="editUserSaveBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let searchQuery = '';
        let currentUsers = [];

        const ACTION_LABELS = {
            create_user: '创建用户',
            update_user: '更新用户',
            delete_user: '删除用户',
            reset_password: '重置密码',
            change_password: '修改密码',
            change_email: '修改邮箱',
            logout_all: '退出所有设备'
        };

        async function init() {
            await checkAuth();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            loadStats();
            loadUsers();
            loadAuditLogs();
            loadEmails();
        }

        function updateDateTime() {
            const now = new Date();
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', dateOptions);
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', timeOptions);
        }

        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login';
                    return false;
                }
                const user = await response.json();
                if (!user.is_admin) {
                    window.location.href = '/';
                    return false;
                }
                document.getElementById('adminUsername').textContent = user.username;
                return true;
            } catch (error) {
                window.location.href = '/login';
                return false;
            }
        }

        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) {
                return;
            }
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                if (response.ok) {
                    showToast('已退出登录', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1000);
                }
            } catch (error) {
                showToast('退出失败，请稍后重试', 'error');
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                if (!response.ok) {
                    return;
                }
                const stats = await response.json();
                document.getElementById('statUsers').textContent = stats.users_total;
                document.getElementById('statActive').textContent = stats.active_users;
                document.getElementById('statTodos').textContent = stats.todos_total;
                document.getElementById('statPending').textContent = stats.todos_pending;
                document.getElementById('statOverdue').textContent = stats.todos_overdue;
                document.getElementById('statRate').textContent = stats.completion_rate + '%';
                document.getElementById('statEmailsPending').textContent = stats.emails_pending;
                document.getElementById('statEmailsFailed').textContent = stats.emails_failed;
            } catch (error) {
                // 统计失败不影响主流程
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`/api/admin/users?page=${currentPage}&search=${encodeURIComponent(searchQuery)}`);
                const data = await response.json();

                if (response.ok) {
                    currentUsers = data.users;
                    renderUsers(data.users);
                    renderPagination(data.total_pages, data.page);
                    totalPages = data.total_pages;
                } else {
                    showToast(data.error || '加载失败', 'error');
                }
            } catch (error) {
                showToast('加载失败，请稍后重试', 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9">
                            <div class="empty-state">
                                <div class="empty-state-icon">
                                    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="16" cy="14" r="5"/>
                                        <path d="M6 34c0-5.5 4.5-10 10-10s10 4.5 10 10"/>
                                        <circle cx="34" cy="18" r="4"/>
                                        <path d="M28 34c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                                    </svg>
                                </div>
                                <p>暂无用户</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.username)}</td>
                    <td>${escapeHtml(user.email || '-')}</td>
                    <td>${user.is_admin ? '<span class="admin-badge">管理员</span>' : '用户'}</td>
                    <td><span class="status-badge ${user.is_active ? 'status-active' : 'status-disabled'}">${user.is_active ? '正常' : '已禁用'}</span></td>
                    <td>${user.todo_count}</td>
                    <td>${formatDateTime(user.created_at)}</td>
                    <td>${user.last_login_at ? formatDateTime(user.last_login_at) : '从未登录'}</td>
                    <td>
                        <button class="btn-view" onclick="viewUser(${user.id})">查看</button>
                        <button class="btn-edit-user" onclick="openEditUserModal(${user.id})">编辑</button>
                        <button class="btn-reset" onclick="resetPassword(${user.id})">重置密码</button>
                        <button class="btn-toggle" onclick="toggleActive(${user.id}, ${user.is_active})">${user.is_active ? '禁用' : '启用'}</button>
                        ${user.locked ? '<button class="btn-unlock" onclick="unlockUser(' + user.id + ')">解锁</button>' : ''}
                        <button class="btn-delete" onclick="deleteUser(${user.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(totalPages, currentPage) {
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="changePage(${i})" ${i === currentPage ? 'class="active"' : ''}>${i}</button>`;
            }

            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;

            pagination.innerHTML = html;
        }

        function changePage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadUsers();
        }

        let searchTimer = null;

        function handleSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = document.getElementById('searchInput').value.trim();
                currentPage = 1;
                loadUsers();
            }, 300);
        }

        async function loadAuditLogs() {
            try {
                const response = await fetch('/api/admin/audit-logs?limit=10');
                if (!response.ok) {
                    return;
                }
                const logs = await response.json();
                const container = document.getElementById('auditLogs');

                if (!logs.length) {
                    container.innerHTML = '<p class="audit-empty">暂无操作记录</p>';
                    return;
                }

                container.innerHTML = logs.map(log => `
                    <div class="audit-item">
                        <span>${escapeHtml(log.actor_name)} ${ACTION_LABELS[log.action] || log.action}${log.target_id ? ' #' + log.target_id : ''}</span>
                        <span class="audit-time">${formatDateTime(log.created_at)}</span>
                    </div>
                `).join('');
            } catch (error) {
                // 日志加载失败不影响主流程
            }
        }

        const EMAIL_STATUS_LABELS = { pending: '待发送', sent: '已发送', failed: '失败' };

        async function loadEmails() {
            try {
                const response = await fetch('/api/admin/emails?status=all&limit=10');
                if (!response.ok) {
                    return;
                }
                const emails = await response.json();
                const container = document.getElementById('emailList');

                if (!emails.length) {
                    container.innerHTML = '<p class="audit-empty">暂无邮件记录</p>';
                    return;
                }

                container.innerHTML = emails.map(mail => `
                    <div class="audit-item">
                        <span>${EMAIL_STATUS_LABELS[mail.status] || mail.status} · ${escapeHtml(mail.to_email)} · ${escapeHtml(mail.subject)}${mail.last_error ? ' · ' + escapeHtml(mail.last_error) : ''}</span>
                        <span class="audit-time">
                            ${formatDateTime(mail.created_at)}
                            ${mail.status === 'failed' ? '<button class="btn-unlock" onclick="retryEmail(' + mail.id + ')">重发</button>' : ''}
                        </span>
                    </div>
                `).join('');
            } catch (error) {
                // 邮件队列加载失败不影响主流程
            }
        }

        async function retryEmail(emailId) {
            try {
                const response = await fetch(`/api/admin/emails/${emailId}/retry`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (response.ok) {
                    showToast(result.message || '已重新加入队列', 'success');
                    loadEmails();
                    loadStats();
                    loadAuditLogs();
                } else {
                    showToast(result.error || '重发失败', 'error');
                }
            } catch (error) {
                showToast('重发失败，请稍后重试', 'error');
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            document.getElementById('addUserForm').reset();
        }

        async function handleAddUser(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const data = {
                username: formData.get('username').trim(),
                email: formData.get('email').trim(),
                password: formData.get('password'),
                is_admin: formData.get('isAdmin') === 'on'
            };

            if (data.username.length < 3) {
                showToast('用户名至少需要3个字符', 'error');
                return;
            }

            if (data.password.length < 6) {
                showToast('密码至少需要6个字符', 'error');
                return;
            }

            if (!data.email || !data.email.includes('@')) {
                showToast('请输入有效的邮箱地址', 'error');
                return;
            }

            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showToast('添加成功', 'success');
                    closeAddModal();
                    loadUsers();
                    loadStats();
                    loadAuditLogs();
                } else {
                    showToast(result.error || '添加失败', 'error');
                }
            } catch (error) {
                showToast('添加失败，请稍后重试', 'error');
            }
        }

        function openEditUserModal(userId) {
            const user = currentUsers.find(item => item.id === userId);
            if (!user) {
                return;
            }

            document.getElementById('editUserId').value = user.id;
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editUserEmail').value = user.email || '';
            document.getElementById('editIsAdmin').checked = !!user.is_admin;
            document.getElementById('editIsActive').checked = !!user.is_active;
            document.getElementById('editUserModal').classList.add('show');
        }

        function closeEditUserModal() {
            document.getElementById('editUserModal').classList.remove('show');
        }

        async function saveEditUser(event) {
            event.preventDefault();
            const userId = document.getElementById('editUserId').value;
            const payload = {
                username: document.getElementById('editUsername').value.trim(),
                email: document.getElementById('editUserEmail').value.trim(),
                is_admin: document.getElementById('editIsAdmin').checked,
                is_active: document.getElementById('editIsActive').checked
            };

            const button = document.getElementById('editUserSaveBtn');
            button.disabled = true;
            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    showToast(result.message || '已保存', 'success');
                    closeEditUserModal();
                    loadUsers();
                    loadStats();
                    loadAuditLogs();
                } else {
                    showToast(result.error || '保存失败', 'error');
                }
            } catch (error) {
                showToast('保存失败，请稍后重试', 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function toggleActive(userId, isActive) {
            const action = isActive ? '禁用' : '启用';
            if (!confirm(`确定要${action}这个用户吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: !isActive })
                });
                const result = await response.json();

                if (response.ok) {
                    showToast(`已${action}`, 'success');
                    loadUsers();
                    loadStats();
                    loadAuditLogs();
                } else {
                    showToast(result.error || `${action}失败`, 'error');
                }
            } catch (error) {
                showToast(`${action}失败，请稍后重试`, 'error');
            }
        }

        async function unlockUser(userId) {
            if (!confirm('确定要解除该用户的登录锁定吗？')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}/unlock`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (response.ok) {
                    showToast(result.message || '已解除锁定', 'success');
                    loadUsers();
                    loadAuditLogs();
                } else {
                    showToast(result.error || '解锁失败', 'error');
                }
            } catch (error) {
                showToast('解锁失败，请稍后重试', 'error');
            }
        }

        function openTestEmailModal() {
            document.getElementById('testEmailModal').classList.add('show');
        }

        function closeTestEmailModal() {
            document.getElementById('testEmailModal').classList.remove('show');
            document.getElementById('testEmailForm').reset();
        }

        async function handleTestEmail(event) {
            event.preventDefault();

            const email = document.getElementById('testEmail').value.trim();

            if (!email || !email.includes('@')) {
                showToast('请输入有效的邮箱地址', 'error');
                return;
            }

            const submitBtn = event.target.querySelector('.btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';

            try {
                const response = await fetch('/api/admin/test-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (response.ok) {
                    showToast(result.message, 'success');
                    closeTestEmailModal();
                } else {
                    showToast(result.error || '发送失败', 'error');
                }
            } catch (error) {
                showToast('发送失败，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发送测试邮件';
            }
        }

        async function viewUser(userId) {
            try {
                const response = await fetch(`/api/admin/users/${userId}`);
                const user = await response.json();

                if (response.ok) {
                    renderUserDetail(user);
                    document.getElementById('viewModal').classList.add('show');
                } else {
                    showToast(user.error || '加载失败', 'error');
                }
            } catch (error) {
                showToast('加载失败，请稍后重试', 'error');
            }
        }

        function renderUserDetail(user) {
            const detailHtml = `
                <div class="user-detail">
                    <h3>基本信息</h3>
                    <div class="detail-item">
                        <span class="detail-label">用户名:</span>
                        <span class="detail-value">${escapeHtml(user.username)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">邮箱:</span>
                        <span class="detail-value">${escapeHtml(user.email || '-')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">角色:</span>
                        <span class="detail-value">${user.is_admin ? '管理员' : '用户'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">状态:</span>
                        <span class="detail-value">${user.is_active ? '正常' : '已禁用'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">注册时间:</span>
                        <span class="detail-value">${formatDateTime(user.created_at)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">最后登录:</span>
                        <span class="detail-value">${user.last_login_at ? formatDateTime(user.last_login_at) : '从未登录'}</span>
                    </div>
                </div>
                <div class="todos-list">
                    <h3>待办事项 (${user.todos.length})</h3>
                    ${user.todos.length === 0 ? '<p style="color: var(--gray-400); text-align: center; padding: 20px;">暂无待办事项</p>' :
                        user.todos.map(todo => `
                            <div class="todo-item">
                                <div class="todo-checkbox ${todo.completed ? 'checked' : ''}"></div>
                                <div class="todo-content">
                                    <div class="todo-title">${escapeHtml(todo.title)}</div>
                                    <div class="todo-date">${todo.due_date ? '截止 ' + escapeHtml(todo.due_date) + ' · ' : ''}${formatDateTime(todo.created_at)}</div>
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
            document.getElementById('userDetail').innerHTML = detailHtml;
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('show');
        }

        async function deleteUser(userId) {
            if (!confirm('确定要删除这个用户吗？此操作不可恢复。')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
                const result = await response.json();

                if (response.ok) {
                    showToast('删除成功', 'success');
                    loadUsers();
                    loadStats();
                    loadAuditLogs();
                } else {
                    showToast(result.error || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败，请稍后重试', 'error');
            }
        }

        async function resetPassword(userId) {
            const newPassword = prompt('请输入新密码（至少6位）：');
            if (!newPassword || newPassword.length < 6) {
                showToast('密码长度至少6位', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: newPassword })
                });

                const result = await response.json();

                if (response.ok) {
                    showToast(result.message || '密码重置成功', 'success');
                    loadAuditLogs();
                } else {
                    showToast(result.error || '重置失败', 'error');
                }
            } catch (error) {
                showToast('重置失败，请稍后重试', 'error');
            }
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(String(dateStr).replace(' ', 'T'));
            if (isNaN(date.getTime())) return '-';
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        init();
    </script>
    <script src="/static/theme.js" defer></script>
</body>
</html>
