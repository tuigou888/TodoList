<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 每日待办事项</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='3' fill='%23C4664A'/%3E%3Crect x='5' y='7' width='22' height='18' rx='2' fill='%23FAF8F5'/%3E%3Cpath d='M8 12 L12 16 L20 8' stroke='%237A9B76' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='8' y1='20' x2='20' y2='20' stroke='%23D4C8BC' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.proxy.ustclug.org">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.proxy.ustclug.org/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF8F5;
            --white: #FFFFFF;
            --charcoal: #1A1A2E;
            --terracotta: #C4664A;
            --terracotta-hover: #A8553A;
            --sage: #7A9B76;
            --gray-100: #F5F0EB;
            --gray-200: #E8E0D8;
            --gray-300: #D4C8BC;
            --gray-400: #A89888;
            --gray-500: #7A6E62;
            --gray-600: #5A5047;
            --gray-700: #3D3530;
            --gray-800: #2A2420;
            --shadow-sm: 0 1px 4px rgba(42,36,32,0.04);
            --shadow: 0 2px 12px rgba(42,36,32,0.06);
            --shadow-md: 0 4px 20px rgba(42,36,32,0.08);
            --shadow-lg: 0 8px 32px rgba(42,36,32,0.10);
            --radius: 12px;
            --radius-md: 14px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Noise texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* Decorative circles */
        .deco-circle-1 {
            position: fixed;
            top: 8%;
            right: 10%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,102,74,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .deco-circle-2 {
            position: fixed;
            bottom: 10%;
            left: 5%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(122,155,118,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(212,200,188,0.4);
            animation: fadeSlideUp 0.5s ease-out both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: var(--terracotta);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 4px 16px rgba(196,102,74,0.25);
        }

        .logo svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .login-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 26px;
            color: var(--gray-800);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: var(--gray-500);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray-700);
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--gray-400);
            transition: color 0.2s;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 15px;
            transition: all 0.2s;
            background: var(--gray-100);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .form-group input:hover {
            border-color: var(--gray-300);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--terracotta);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(196,102,74,0.08);
        }

        .input-wrapper:focus-within svg {
            color: var(--terracotta);
        }

        .form-group input::placeholder {
            color: var(--gray-400);
        }

        .btn-login {
            width: 100%;
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-login:hover {
            background: var(--terracotta-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .footer a {
            color: var(--terracotta);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer a:hover {
            color: var(--terracotta-hover);
        }

        .footer-divider {
            color: var(--gray-300);
        }

        .footer-text {
            color: var(--gray-500);
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-800);
            color: white;
            padding: 14px 28px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error { background: #D4503A; }
        .toast.success { background: var(--sage); }

        .toast::before { font-size: 16px; }
        .toast.success::before { content: '\2713'; }
        .toast.error::before { content: '\2715'; }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 16px;
                border-radius: var(--radius-md);
            }

            .logo {
                width: 48px;
                height: 48px;
            }

            .logo svg {
                width: 24px;
                height: 24px;
            }

            .login-header h1 {
                font-size: 22px;
            }

            .login-header p {
                font-size: 14px;
            }

            .form-group input {
                padding: 12px 14px 12px 40px;
                font-size: 15px;
            }

            .input-wrapper svg {
                width: 18px;
                height: 18px;
                left: 12px;
            }

            .btn-login {
                padding: 14px;
                font-size: 15px;
            }

            .footer-links {
                flex-direction: column;
                gap: 12px;
            }

            .footer-divider {
                display: none;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .login-container {
                max-width: 90%;
                padding: 40px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="deco-circle-1"></div>
    <div class="deco-circle-2"></div>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
                </svg>
            </div>
            <h1>欢迎回来</h1>
            <p>登录您的账户以管理待办事项</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span>登录</span>
            </button>
        </form>

        <div class="footer">
            <div class="footer-links">
                <a href="/register">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    立即注册
                </a>
                <span class="footer-divider">|</span>
                <a href="/forgot-password">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    忘记密码
                </a>
            </div>
            <p class="footer-text">安全登录，保护您的数据</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showToast('请填写所有字段', 'error');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('登录成功', 'success');
                    setTimeout(() => {
                        if (data.is_admin) {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    showToast(data.error || '登录失败', 'error');
                }
            } catch (error) {
                showToast('登录失败，请稍后重试', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
