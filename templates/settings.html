<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户设置 - 每日待办事项</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='3' fill='%23C4664A'/%3E%3Crect x='5' y='7' width='22' height='18' rx='2' fill='%23FAF8F5'/%3E%3Cpath d='M8 12 L12 16 L20 8' stroke='%237A9B76' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='8' y1='20' x2='20' y2='20' stroke='%23D4C8BC' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.proxy.ustclug.org">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.proxy.ustclug.org/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF8F5;
            --white: #FFFFFF;
            --charcoal: #1A1A2E;
            --terracotta: #C4664A;
            --terracotta-hover: #A8553A;
            --sage: #7A9B76;
            --danger: #D4503A;
            --gray-100: #F5F0EB;
            --gray-200: #E8E0D8;
            --gray-300: #D4C8BC;
            --gray-400: #A89888;
            --gray-500: #7A6E62;
            --gray-600: #5A5047;
            --gray-700: #3D3530;
            --gray-800: #2A2420;
            --shadow-sm: 0 1px 4px rgba(42,36,32,0.04);
            --shadow: 0 2px 12px rgba(42,36,32,0.06);
            --shadow-md: 0 4px 20px rgba(42,36,32,0.08);
            --radius: 12px;
            --radius-md: 14px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            padding: 24px;
            color: var(--charcoal);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 4px;
        }

        .page-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 26px;
            color: var(--gray-800);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--gray-500);
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: var(--radius);
            background: var(--gray-100);
            color: var(--gray-600);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-ghost:hover { background: var(--gray-200); color: var(--gray-800); }

        .card {
            background: var(--white);
            border: 1px solid rgba(212,200,188,0.4);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 24px 26px;
        }

        .card h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 17px;
            color: var(--gray-800);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .info-item {
            background: var(--gray-100);
            border-radius: var(--radius-md);
            padding: 14px 16px;
        }

        .info-item .label {
            display: block;
            font-size: 12px;
            color: var(--gray-500);
            margin-bottom: 6px;
        }

        .info-item .value {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-800);
            word-break: break-all;
        }

        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--gray-700);
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
        }

        .switch-row input { width: 18px; height: 18px; accent-color: var(--terracotta); }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .row label {
            font-size: 14px;
            color: var(--gray-600);
        }

        input[type="text"], input[type="email"], input[type="password"], input[type="time"] {
            padding: 11px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            transition: all 0.2s;
            min-width: 180px;
        }

        input:focus {
            outline: none;
            border-color: var(--terracotta);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(196,102,74,0.1);
        }

        .form-grid {
            display: grid;
            gap: 12px;
            max-width: 420px;
        }

        .btn-primary, .btn-secondary, .btn-danger {
            border: none;
            border-radius: var(--radius);
            padding: 11px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--terracotta); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--terracotta-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--gray-100); color: var(--gray-600); }
        .btn-secondary:hover:not(:disabled) { background: var(--gray-200); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { background: #B84430; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .hint {
            font-size: 13px;
            color: var(--gray-500);
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .danger-zone { border-color: rgba(212,80,58,0.25); }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-800);
            color: white;
            padding: 13px 26px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--sage); }

        @media (max-width: 520px) {
            body { padding: 14px; }
            .card { padding: 20px; }
            .page-header { flex-direction: column; }
            .page-header h1 { font-size: 22px; }
            .row { align-items: stretch; }
            input[type="text"], input[type="email"], input[type="password"], input[type="time"] { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>账户设置</h1>
                <p class="subtitle">管理你的账号、邮箱与每日提醒</p>
            </div>
            <a class="btn-ghost" href="/">← 返回首页</a>
        </header>

        <section class="card">
            <h2>基本信息</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">用户名</span>
                    <span class="value" id="username">-</span>
                </div>
                <div class="info-item">
                    <span class="label">邮箱</span>
                    <span class="value" id="email">-</span>
                </div>
                <div class="info-item">
                    <span class="label">角色</span>
                    <span class="value" id="role">-</span>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>每日提醒</h2>
            <form id="reminderForm" onsubmit="saveReminder(event)">
                <label class="switch-row">
                    <input type="checkbox" id="reminderEnabled">
                    <span>启用每日提醒邮件</span>
                </label>
                <div class="row">
                    <label for="reminderTime">提醒时间</label>
                    <input type="time" id="reminderTime" value="09:00">
                    <button type="submit" class="btn-primary" id="saveReminderBtn">保存设置</button>
                    <button type="button" class="btn-secondary" id="sendNowBtn" onclick="sendReminderNow()">立即发送一次</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>修改密码</h2>
            <form id="passwordForm" class="form-grid" onsubmit="changePassword(event)">
                <input type="password" id="currentPassword" placeholder="当前密码" autocomplete="current-password" required>
                <input type="password" id="newPassword" placeholder="新密码（至少6位）" autocomplete="new-password" minlength="6" required>
                <input type="password" id="confirmPassword" placeholder="确认新密码" autocomplete="new-password" minlength="6" required>
                <div>
                    <button type="submit" class="btn-primary" id="changePasswordBtn">修改密码</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>修改邮箱</h2>
            <form id="emailForm" class="form-grid" onsubmit="changeEmail(event)">
                <input type="email" id="newEmail" placeholder="新邮箱地址" autocomplete="email" required>
                <input type="password" id="emailPassword" placeholder="当前密码" autocomplete="current-password" required>
                <div>
                    <button type="submit" class="btn-primary" id="changeEmailBtn">更新邮箱</button>
                </div>
            </form>
        </section>

        <section class="card danger-zone">
            <h2>登录设备</h2>
            <p class="hint">退出后，所有设备（包括当前浏览器）上的登录状态都会失效，需要重新登录。</p>
            <button type="button" class="btn-danger" id="logoutAllBtn" onclick="logoutAll()">退出所有设备</button>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const pad = (value) => String(value).padStart(2, '0');

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function api(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            let data = {};
            try { data = await response.json(); } catch (error) { data = {}; }
            if (!response.ok) {
                throw new Error(data.error || '操作失败，请稍后重试');
            }
            return data;
        }

        async function init() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
                const user = await response.json();
                document.getElementById('username').textContent = user.username;
                document.getElementById('email').textContent = user.email || '未设置';
                document.getElementById('role').textContent = user.is_admin ? '管理员' : '普通用户';
                document.getElementById('reminderEnabled').checked = !!user.reminder_enabled;
                document.getElementById('reminderTime').value =
                    pad(user.reminder_hour) + ':' + pad(user.reminder_minute);
                if (user.email) {
                    document.getElementById('newEmail').value = user.email;
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function saveReminder(event) {
            event.preventDefault();
            const button = document.getElementById('saveReminderBtn');
            const enabled = document.getElementById('reminderEnabled').checked;
            const time = document.getElementById('reminderTime').value || '09:00';
            const parts = time.split(':');
            const hour = parseInt(parts[0], 10);
            const minute = parseInt(parts[1] || '0', 10);

            button.disabled = true;
            try {
                await api('/api/me/reminder', {
                    method: 'PUT',
                    body: JSON.stringify({
                        reminder_hour: hour,
                        reminder_minute: minute,
                        reminder_enabled: enabled
                    })
                });
                showToast(enabled ? '提醒设置已保存' : '每日提醒已关闭', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function sendReminderNow() {
            const button = document.getElementById('sendNowBtn');
            button.disabled = true;
            try {
                const data = await api('/api/send-reminder-now', { method: 'POST' });
                showToast(data.message || '提醒已发送', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function changePassword(event) {
            event.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showToast('新密码至少需要6个字符', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('两次输入的新密码不一致', 'error');
                return;
            }

            const button = document.getElementById('changePasswordBtn');
            button.disabled = true;
            try {
                const data = await api('/api/me/password', {
                    method: 'PUT',
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                showToast(data.message || '密码已修改', 'success');
                setTimeout(() => { window.location.href = '/login'; }, 1500);
            } catch (error) {
                showToast(error.message, 'error');
                button.disabled = false;
            }
        }

        async function changeEmail(event) {
            event.preventDefault();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('emailPassword').value;

            if (!email || !email.includes('@')) {
                showToast('请输入有效的邮箱地址', 'error');
                return;
            }

            const button = document.getElementById('changeEmailBtn');
            button.disabled = true;
            try {
                const data = await api('/api/me/email', {
                    method: 'PUT',
                    body: JSON.stringify({ email, current_password: password })
                });
                document.getElementById('email').textContent = data.email || email;
                document.getElementById('emailPassword').value = '';
                showToast(data.message || '邮箱已更新', 'success');
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function logoutAll() {
            if (!confirm('确定要退出所有设备吗？')) {
                return;
            }
            const button = document.getElementById('logoutAllBtn');
            button.disabled = true;
            try {
                await api('/api/me/logout-all', { method: 'POST' });
                showToast('已退出所有设备', 'success');
                setTimeout(() => { window.location.href = '/login'; }, 1000);
            } catch (error) {
                showToast(error.message, 'error');
                button.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
