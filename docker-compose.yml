services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-list-app
    ports:
      - "5145:5145"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - FLASK_DEBUG=0
    volumes:
      - ./todos.db:/app/todos.db
      - flask_session_data:/app/flask_session
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5145/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  flask_session_data:
